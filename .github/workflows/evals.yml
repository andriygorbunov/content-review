name: evals
on: [push, pull_request]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Seed + freeze
        run: |
          export CR_DB=/tmp/review.db
          python seed_demo.py
          python -m src.cli freeze --name ci

      # Baseline first, ungated - it records a run so the CI log shows the climb.
      - name: Baseline (v1)
        run: |
          export CR_DB=/tmp/review.db
          python -m src.cli eval --snapshot ci --labeler keyword || true

      # The gate. Fails the build if precision drops below the floor: model and
      # prompt regressions get caught like code bugs.
      - name: Regression gate (v2)
        run: |
          export CR_DB=/tmp/review.db
          python -m src.cli eval --snapshot ci --labeler keyword-v2 --min-precision 0.65

      # Precision says how often a flag was right. It does NOT say whether the
      # labeler is tracking the human or just tracking the base rate. On a
      # skewed slice, answering "ok" every time scores well on raw agreement
      # and carries no signal. Kappa corrects for chance; gate on it too.
      - name: Agreement gate (kappa vs golden)
        run: |
          export CR_DB=/tmp/review.db
          python -m src.cli agreement --snapshot ci --raters keyword-v2,golden \
            --by-slice --min-kappa 0.40

      # Ungated: shows v1's kappa next to v2's so the CI log carries the climb,
      # and surfaces the high-agreement/low-kappa paradox on the baseline.
      - name: Baseline agreement (v1, ungated)
        run: |
          export CR_DB=/tmp/review.db
          python -m src.cli agreement --snapshot ci --raters keyword,golden --by-slice || true

      # Three raters at once. Fleiss' kappa over v1, v2 and golden together.
      - name: Multi-rater agreement (Fleiss)
        run: |
          export CR_DB=/tmp/review.db
          python -m src.cli agreement --snapshot ci --raters keyword,keyword-v2,golden || true

      - name: Show the improvement
        run: |
          export CR_DB=/tmp/review.db
          python -m src.cli compare --snapshot ci

